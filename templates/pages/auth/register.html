{% extends "base.html" %}

{% block title %}Register - CodeSpace{% endblock %}

{% block head %}
<link rel="stylesheet" href="/css/posts.css">
{% endblock %}

{% block content %}
<div>
    <form action="/auth/register" method="post" class="max-w-md mx-auto mt-10">
        <div class="flex items-center space-x-2 flex justify-center">
            <a href="/auth/register" class="text-white text-xl font-bold hover:text-blue-400 transition duration-200">Register</a>
            <span class="text-gray-400 text-xl">|</span>
            <a href="/auth/login" class="text-white text-xl font-bold hover:text-blue-400 transition duration-200">Login</a>
        </div>
        
        {% if error.is_some() %}
        <div class="bg-red-500 text-white p-2 rounded mt-4">
            {{ error.as_ref().unwrap() }}
        </div>
        {% endif %}
        
        <br>
        <div>
            <label for="username" class="text-gray-300">Username:</label>
            <br> 
            <input type="text" name="username" id="username" required
                value="{{ username.as_deref().unwrap_or("") }}"
                class="bg-gray-900 text-white rounded-xl"/>
        </div>
        
        <div>
            <label for="password" class="text-gray-300">Password:</label>
            <br> 
            <input type="password" name="password" id="password" required
                class="bg-gray-900 text-white rounded-xl"/> 
        </div>
        
        <div>
            <label for="confirm_password" class="text-gray-300">Confirm password:</label>
            <br> 
            <input type="password" name="confirm_password" id="confirm_password" required
                class="bg-gray-900 text-white rounded-xl"/>
        </div>
        
        <br> 
        <div class="flex justify-center"> 
            <button type="submit" class="
            rounded-full
            w-1/3 bg-blue-600 
            text-white font-semibold 
            py-2 rounded hover:bg-blue-700 transition duration-200">
                Register
            </button>
        </div>    
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        if (password !== confirm) {
            e.preventDefault();
            alert('Passwords do not match');
        }
    });
</script>
{% endblock %}
